[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_deps = 
    https://github.com/adafruit/MAX6675-library.git
    https://github.com/adafruit/Adafruit_SHT31.git
    https://github.com/Bodmer/TFT_eSPI.git
    https://github.com/MaffooClock/ESP32RotaryEncoder.git
    https://github.com/madhephaestus/ESP32Servo.git
    https://github.com/knolleary/pubsubclient.git
    https://github.com/bblanchon/ArduinoJson.git
    https://github.com/adafruit/Adafruit_SHT31.git
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9488_DRIVER          ; change to your actual 3.5" driver (ILI9481/ILI9486/ILI9488/etc.)
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=2
    -DTFT_RST=4
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=20000000


